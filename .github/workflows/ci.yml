name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit-test the eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (includes golden set validation)
        run: pytest -q

  artifacts:
    name: Validate agent artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connector is valid JSON in Swagger 2.0 form
        run: jq -e '.swagger == "2.0" and (.paths | length > 0)' connector/cert-watcher.swagger.json
      - name: Topic files are valid YAML
        run: |
          pip install pyyaml
          python -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" agent/topics/*.yaml
